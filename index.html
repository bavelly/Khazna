<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Khazna">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Khazna</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0f172a;--card:#1e293b;--line:#334155;--txt:#f1f5f9;--mut:#94a3b8;--plus:#22c55e;--minus:#ef4444;--acc:#38bdf8}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Cairo,system-ui,sans-serif}
  body{padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 24px)}
  .wrap{max-width:480px;margin:0 auto}
  .bal{background:linear-gradient(135deg,#1e3a8a,#0e7490);border-radius:22px;padding:22px 20px;text-align:center;box-shadow:0 10px 30px #0006;position:relative}
  .bal small{color:#cbd5e1;font-size:15px}
  .bal .n{font-size:46px;font-weight:800;line-height:1.2;margin-top:4px;direction:ltr}
  .bal .n.neg{color:#fecaca}
  .sub{display:flex;justify-content:space-around;margin-top:12px;font-size:13px;color:#e2e8f0}
  .sub b{display:block;font-size:16px;direction:ltr}
  .gear{position:absolute;top:10px;left:12px;background:none;color:#cbd5e1;font-size:20px;padding:4px}
  .ref{position:absolute;top:10px;right:12px;background:none;color:#cbd5e1;font-size:20px;padding:4px}
  .card{background:var(--card);border-radius:18px;padding:14px;margin-top:14px}
  input{width:100%;background:#0b1220;border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:14px;font:inherit;font-size:18px;outline:none}
  input:focus{border-color:var(--acc)}
  #amt{font-size:28px;font-weight:700;text-align:center;direction:ltr}
  #note{margin-top:10px;font-size:16px}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  button{font:inherit;border:0;border-radius:14px;cursor:pointer}
  .big{font-size:30px;font-weight:800;padding:12px;color:#fff}
  .big span{display:block;font-size:14px;font-weight:600;opacity:.9}
  .p{background:var(--plus)} .m{background:var(--minus)}
  .big:active{transform:scale(.97)} .big:disabled{opacity:.5}
  .quick{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;justify-content:center}
  .quick button{background:#0b1220;color:var(--mut);border:1px solid var(--line);padding:6px 12px;font-size:14px;direction:ltr}
  h3{margin:20px 4px 8px;font-size:16px;color:var(--mut);display:flex;justify-content:space-between}
  .list{display:flex;flex-direction:column;gap:8px}
  .row{background:var(--card);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px}
  .row .a{font-weight:800;font-size:18px;direction:ltr;min-width:90px;text-align:left}
  .row .a.p{color:var(--plus);background:none} .row .a.m{color:var(--minus);background:none}
  .row .i{flex:1;min-width:0}
  .row .t{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .w{font-size:12px;color:var(--mut)}
  .row .x{background:none;color:var(--mut);font-size:18px;padding:4px 8px}
  .msg{text-align:center;color:var(--mut);padding:18px;font-size:14px}
  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translateX(-50%);background:#020617;border:1px solid var(--line);padding:10px 18px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
  .toast.on{opacity:1}
  .dlg{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px;z-index:8}
  .dlg.on{display:flex}
  .box{background:var(--card);border-radius:18px;padding:18px;max-width:380px;width:100%}
  .box h2{margin:0 0 6px;font-size:20px}
  .box p{color:var(--mut);font-size:14px;margin:6px 0 12px}
  .box label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
  .box .r{display:flex;gap:8px;margin-top:14px}
  .box .r button{flex:1;padding:12px;font-weight:700;color:#fff;background:var(--line)}
  .box .r button.go{background:var(--acc);color:#04202d}
  .box .r button.del{background:var(--minus)}
  #tok{direction:ltr;font-size:14px}
  .live{width:8px;height:8px;border-radius:50%;background:var(--mut);display:inline-block;margin-inline-end:6px;vertical-align:middle}
  .live.ok{background:var(--plus)} .live.bad{background:var(--minus)}
  .tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--card);padding:5px;border-radius:14px;margin-bottom:14px}
  .tabs button{background:none;color:var(--mut);padding:10px;font-weight:700;font-size:16px;border-radius:10px}
  .tabs button.on{background:var(--acc);color:#04202d}
  .hide{display:none!important}
  .dsum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .dsum div{background:#0b1220;border-radius:12px;padding:8px;text-align:center;font-size:12px;color:var(--mut)}
  .dsum b{display:block;font-size:18px;color:var(--txt);direction:ltr}
  .dsum .w b{color:#fbbf24}
  #dq{font-size:22px;font-weight:700;text-align:center;direction:ltr}
  .addrow{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:10px}
  .addrow input{font-size:16px;padding:12px;direction:ltr;text-align:center}
  .addrow button{background:var(--plus);color:#fff;font-weight:800;padding:0 16px;font-size:15px}
  .seg{display:flex;gap:6px;margin-top:10px}
  .seg button{flex:1;background:#0b1220;color:var(--mut);border:1px solid var(--line);padding:8px;font-size:14px;font-weight:600}
  .seg button.on{border-color:var(--acc);color:var(--acc)}
  .drow{background:var(--card);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:12px;border:2px solid transparent}
  .drow.done{opacity:.55}
  .drow.hit{border-color:var(--acc)}
  .chk{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:#0b1220;color:transparent;font-size:24px;font-weight:900;flex:none}
  .drow.done .chk{background:var(--plus);border-color:var(--plus);color:#fff}
  .drow .o{font-size:20px;font-weight:800;direction:ltr}
  .drow .i{flex:1;min-width:0}
  .drow .w{font-size:12px;color:var(--mut)}
  .drow .a{font-weight:800;font-size:18px;direction:ltr;color:#fbbf24}
  .drow .x{background:none;color:var(--mut);font-size:16px;padding:4px 6px}
  .det{background:#0b1220;border-radius:12px;padding:12px;margin:-4px 0 4px;font-size:14px;line-height:1.5;border:1px solid var(--line)}
  .det .h{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:15px}
  .det .dm{color:var(--mut);font-size:13px}
  .det .it{border-top:1px solid var(--line);padding:8px 0}
  .det .it b{font-size:15px}
  .det .nm{color:#fbbf24;font-weight:600}
  .det a.ph{color:var(--acc);text-decoration:none;font-weight:700}
  .det .col{background:#0e7490;color:#fff;border-radius:10px;padding:10px 12px;margin:6px 0 8px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
  .det .col b{font-size:22px;direction:ltr}
  .tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;margin-inline-start:4px}
  .tag.ok{background:#14532d;color:#86efac} .tag.no{background:#422006;color:#fcd34d} .tag.x{background:#450a0a;color:#fca5a5}
  .shop{display:inline-block;margin-top:4px;font-size:12px;font-weight:700;color:#04202d;background:#95bf47;border-radius:8px;padding:3px 8px;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="tabs"><button id="tCash" class="on">💰 Cash</button><button id="tDep">📦 Deposits</button></div>

  <div id="vDep" class="hide">
    <div class="card" style="margin-top:0">
      <input id="dq" type="text" inputmode="numeric" placeholder="🔍 Order number" autocomplete="off">
      <div class="seg"><button data-f="all" class="on">All</button><button data-f="open">Open</button><button data-f="done">Shipped ✓</button></div>
      <div class="dsum">
        <div>Total deposits<b id="dTot">0</b></div>
        <div class="w">Not shipped yet<b id="dOpen">0</b></div>
        <div>Orders<b id="dCnt">0</b></div>
      </div>
      <div class="addrow">
        <input id="dOrd" type="text" inputmode="numeric" placeholder="Order #">
        <input id="dAmt" type="text" inputmode="decimal" placeholder="Deposit">
        <button id="dAdd">+ Add</button>
      </div>
    </div>
    <div id="dErr" class="msg hide" style="color:#fca5a5"></div>
    <h3><span>Orders with a deposit</span><span id="dShown"></span></h3>
    <div class="list" id="dList"><div class="msg">Loading…</div></div>
  </div>

  <div id="vCash">
  <div class="bal">
    <button class="gear" id="gear" title="Settings">⚙︎</button>
    <button class="gear" id="bell" title="Notifications" style="left:44px">🔕</button>
    <button class="ref" id="ref" title="Refresh">↻</button>
    <small><span class="live" id="dot"></span>Cash balance</small>
    <div class="n" id="bal">—</div>
    <div class="sub">
      <div>Total in<b id="tin">0</b></div>
      <div>Total out<b id="tout">0</b></div>
    </div>
  </div>

  <div class="card">
    <input id="amt" type="text" inputmode="decimal" placeholder="0" autocomplete="off">
    <div class="quick" id="quick"></div>
    <input id="note" type="text" placeholder="Note (optional)" autocomplete="off" maxlength="80">
    <div class="btns">
      <button class="big p" id="bp">+<span>Money in</span></button>
      <button class="big m" id="bm">−<span>Money out</span></button>
    </div>
  </div>

  <h3><span>Recent transactions</span><span id="cnt"></span></h3>
  <div class="list" id="list"><div class="msg">Loading…</div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="dlg" id="setup"><div class="box">
  <h2>First-time setup</h2>
  <p>Enter your name and the GitHub token. You only do this once on each phone.</p>
  <label>Your name</label>
  <input id="nm" type="text" placeholder="e.g. Ahmed" maxlength="20">
  <label>GitHub token</label>
  <input id="tok" type="password" placeholder="github_pat_..." autocomplete="off">
  <div class="r"><button id="notif" style="background:#334155;color:#fff">🔔 Turn on notifications</button></div>
  <div class="r"><button class="go" id="save">Save & start</button></div>
  <p id="setupErr" style="color:#fca5a5"></p>
</div></div>

<div class="dlg" id="dlg"><div class="box" style="text-align:center">
  <p id="dlgTxt" style="color:var(--txt);font-size:16px">Delete this transaction?</p>
  <div class="r"><button id="dlgNo">No</button><button class="del" id="dlgYes">Delete</button></div>
</div></div>

<script>
// ====== Settings ======
const OWNER = 'bavelly';
const DATA_REPO = 'khazna-data';
const FILE = 'data.json';
const VAPID_PUBLIC = 'BNDzjdr7OM6tv9-Wh6fswvhkGW3rqw1HXtsFUQxQevqZYvz7ys5c4SyqBFkE8nhV8p1iu4kBYIepz1_0OOUGL-8';
const SHOP_ADMIN = 'https://admin.shopify.com/store/przmstore/orders';
const OPENING = 252000;   // opening balance if the data file does not exist yet
// Deposits from the notebook (order #, deposit, shipped?)
const DEP_SEED = [[1309,700,1],[1314,300,1],[1313,300,1],[1319,300,1],[1320,300,1],[1323,300,1],[1321,300,1],[1324,300,1],[1329,300,1],[1340,500,0],[1341,300,1],[1343,300,1],[1344,300,1],[1342,300,1],[1346,300,1],[1350,300,0],[1353,300,1],[1355,300,1]];
// =======================
function seedDeposits(s){
  if(s.depInit) return;
  const have=new Set((s.deposits||[]).map(d=>String(d.order)));
  const now=Date.now();
  DEP_SEED.forEach(([o,a,d],i)=>{ if(have.has(String(o))) return; s.deposits.push({id:'d-'+o,order:String(o),amount:a,done:!!d,doneBy:d?'Notebook':'',doneAt:d?now:0,by:'Notebook',at:now+i}); });
  s.depInit=true;
}

const API = `https://api.github.com/repos/${OWNER}/${DATA_REPO}/contents/${FILE}`;
const $ = id => document.getElementById(id);
const fmt = n => (Math.round(n*100)/100).toLocaleString('en-US',{maximumFractionDigits:2});
const ls = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}} };
let token = ls.get('khazna_token'), myName = ls.get('khazna_name');
let state = {tx:[]}, sha = null, busy = false;

function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('on'),2000); }
function b64enc(str){ const bytes=new TextEncoder().encode(str); let bin=''; bytes.forEach(b=>bin+=String.fromCharCode(b)); return btoa(bin); }
function b64dec(b64){ const bin=atob(b64.replace(/\n/g,'')); const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0)); return new TextDecoder().decode(bytes); }
function parseAmt(s){
  s=String(s||'').trim().replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٫,]/g,'.').replace(/[^\d.]/g,'');
  const n=parseFloat(s); return isFinite(n)&&n>0 ? Math.round(n*100)/100 : 0;
}
function when(ts){ const d=new Date(ts); if(isNaN(d)) return ''; return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+' · '+d.toLocaleTimeString('en-GB',{hour:'numeric',minute:'2-digit'}); }
function dot(c){ $('dot').className='live'+(c?' '+c:''); }

async function gh(method, body){
  const r = await fetch(API + (method==='GET' ? '?t='+Date.now() : ''), {
    method, cache:'no-store',
    headers:{ 'Authorization':'Bearer '+token, 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28' },
    body: body ? JSON.stringify(body) : undefined
  });
  return r;
}

let orders=null, ordersAt=0, openDet=new Set();
async function loadOrders(force){
  const need=(state.deposits||[]).some(d=>!d.done && !(orders&&orders.orders&&orders.orders[String(d.order)]));
  if(!token || (!force && Date.now()-ordersAt < (need?20000:120000))) return;
  try{
    const r=await fetch(`https://api.github.com/repos/${OWNER}/${DATA_REPO}/contents/orders.json?t=`+Date.now(),{cache:'no-store',headers:{'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json'}});
    if(!r.ok) return;
    const j=await r.json(); orders=JSON.parse(b64dec(j.content)); ordersAt=Date.now(); renderDep();
  }catch(e){}
}
// COD to collect: once the deposit is on Shopify, Shopify's unpaid amount already excludes it
function collectFor(o,dep){ const due=Number(o.due)||0, dv=dep?Number(dep.amount)||0:0; const c = dep&&dep.shopAt ? due : due-dv; return Math.max(0,Math.round(c*100)/100); }
function shopState(dep){ return !dep?'':dep.shopAt?'<span class="tag ok">Deposit on Shopify ✓</span>':dep.shopErr?'<span class="tag x">Not on Shopify</span>':dep.done?'':'<span class="tag no">⏳ Sending to Shopify…</span>'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function detailsHTML(num){
  const o = orders && orders.orders && orders.orders[String(num)];
  const link = `<a class="shop" target="_blank" rel="noopener" href="${SHOP_ADMIN}?query=${encodeURIComponent(num)}">Open in Shopify ↗</a>`;
  if(!orders) return `<div class="det"><div class="dm">Loading order details…</div></div>`;
  if(!o) return `<div class="det"><div class="dm">Getting order #${esc(num)} from Shopify… it shows up here within a minute or two.</div>${link}</div>`;
  const pay = o.payment==='PAID'?'<span class="tag ok">Paid</span>':o.payment==='VOIDED'?'<span class="tag x">Voided</span>':'<span class="tag no">'+esc(o.payment==='PENDING'?'COD / pending':o.payment)+'</span>';
  const ful = o.cancelled?'<span class="tag x">Cancelled</span>':o.fulfillment==='FULFILLED'?'<span class="tag ok">Fulfilled</span>':'<span class="tag no">Unfulfilled</span>';
  const items = o.items.map(it=>`<div class="it"><b>${it.qty>1?it.qty+'× ':''}${esc(it.title)}</b>${it.variant?' — '+esc(it.variant):''}${it.details?`<div class="nm">${esc(it.details)}</div>`:''}</div>`).join('');
  const tel = String(o.phone||'').replace(/[^\d+]/g,'');
  return `<div class="det">
    <div class="h"><span>#${esc(num)} · ${esc(o.customer)}</span><span>${pay}${ful}</span></div>
    <div class="dm">${esc(o.date)}${o.phone?` · <a class="ph" href="tel:${tel}">${esc(o.phone)}</a>`:''}</div>
    <div class="dm">${esc(o.address)}${o.city?' — '+esc(o.city):''}</div>
    ${items}
    ${(()=>{ const dep=(state.deposits||[]).find(d=>String(d.order)===String(num)); const dv=dep?Number(dep.amount)||0:0; const col=collectFor(o,dep);
      return `<div class="it">Order total <b>${fmt(o.total)}</b>${o.due!==o.total?` · Unpaid on Shopify <b>${fmt(o.due)}</b>`:''}${dv?`<br>Deposit paid <b style="color:#fbbf24">− ${fmt(dv)}</b> ${shopState(dep)}`:''}${dep&&dep.shopErr?`<div class="dm" style="color:#fca5a5">⚠ ${esc(dep.shopErr)}</div>`:''}</div>
      <div class="col">🚚 Collect by courier <b>${fmt(col)}</b></div>`; })()}
    ${o.note?`<div class="dm">📝 ${esc(o.note)}</div>`:''}
    ${link}
  </div>`;
}
async function load(){
  const r = await gh('GET');
  if(r.status===404){ sha=null; state={tx:[],deposits:[]}; return 'missing'; }
  if(r.status===401||r.status===403) throw new Error('auth');
  if(!r.ok) throw new Error('http '+r.status);
  const j = await r.json(); sha=j.sha;
  try{ state = JSON.parse(b64dec(j.content)); }catch(e){ state={}; }
  if(!state||typeof state!=='object') state={};
  if(!Array.isArray(state.tx)) state.tx=[];
  if(!Array.isArray(state.deposits)) state.deposits=[];
  return 'ok';
}

async function save(msg){
  const body={ message: msg, content: b64enc(JSON.stringify(state,null,1)) };
  if(sha) body.sha=sha;
  const r = await gh('PUT', body);
  if(r.status===409||r.status===422) return 'conflict';
  if(r.status===401||r.status===403) throw new Error('auth');
  if(!r.ok) throw new Error('http '+r.status);
  const j=await r.json(); sha=j.content.sha; return 'ok';
}

// apply a change safely: reload latest, apply, save; retry on conflict
async function mutate(fn, msg){
  for(let i=0;i<4;i++){
    await load();
    fn(state);
    const res = await save(msg);
    if(res==='ok') return true;
    await new Promise(r=>setTimeout(r,400+Math.random()*600));
  }
  return false;
}

function render(){
  renderDep();
  let tin=0,tout=0; const tx=state.tx||[];
  tx.forEach(r=>{ const a=Number(r.amount)||0; if(r.type==='-') tout+=a; else tin+=a; });
  const bal=Math.round((tin-tout)*100)/100;
  $('bal').textContent=fmt(bal); $('bal').classList.toggle('neg',bal<0);
  $('tin').textContent=fmt(tin); $('tout').textContent=fmt(tout);
  $('cnt').textContent=tx.length? tx.length+' transactions':'';
  const list=$('list'); list.innerHTML='';
  if(!tx.length){ list.innerHTML='<div class="msg">No transactions yet</div>'; return; }
  [...tx].sort((a,b)=>(b.at||0)-(a.at||0)).slice(0,300).forEach(r=>{
    const el=document.createElement('div'); el.className='row';
    const a=document.createElement('div'); a.className='a '+(r.type==='-'?'m':'p'); a.textContent=(r.type==='-'?'−':'+')+fmt(r.amount);
    const i=document.createElement('div'); i.className='i';
    const t=document.createElement('div'); t.className='t'; t.textContent=r.note||(r.type==='-'?'Out':'In');
    const w=document.createElement('div'); w.className='w'; w.textContent=(r.by||'—')+' · '+when(r.at);
    i.append(t,w);
    const x=document.createElement('button'); x.className='x'; x.textContent='✕';
    x.onclick=()=>askDelete(r);
    el.append(a,i,x); list.appendChild(el);
  });
}

async function refresh(silent){
  if(!token || busy) return;
  try{
    const st = await load();
    if(st==='missing'){
      // first run: create the file with the opening balance
      state={tx:[{id:'opening',amount:OPENING,type:'+',note:'Opening balance',by:'Opening balance',at:Date.now()}],deposits:[]};
      seedDeposits(state);
      const ok = await save('Opening balance '+OPENING+' + deposits');
      if(ok!=='ok'){ await load(); }
    } else if(!state.depInit){
      await mutate(seedDeposits, 'Add deposits from notebook');
    }
    dot('ok'); render(); loadOrders();
  }catch(e){
    dot('bad');
    if(e.message==='auth'){ showSetup('Token not working or has no access to '+DATA_REPO); }
    else if(!silent){ toast('No connection — try again'); }
    if(!state.tx.length) $('list').innerHTML='<div class="msg">Could not load data. Check your internet or settings ⚙︎</div>';
  }
}

async function add(type){
  if(busy) return;
  const amount=parseAmt($('amt').value);
  if(!amount){ toast('Enter an amount first'); $('amt').focus(); return; }
  busy=true; $('bp').disabled=$('bm').disabled=true; dot();
  const rec={ id:(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2)), amount, type, note:$('note').value.trim().slice(0,80), by:myName||'', at:Date.now() };
  try{
    const ok = await mutate(s=>{ s.tx.push(rec); }, (type==='-'?'- ':'+ ')+amount+(rec.note?' '+rec.note:'')+' ('+(myName||'')+')');
    if(ok){ $('amt').value=''; $('note').value=''; toast((type==='-'?'−':'+')+fmt(amount)+' ✓'); dot('ok'); }
    else toast('Save failed — try again');
  }catch(e){ dot('bad'); toast(e.message==='auth'?'Token problem':'Save failed — check your internet'); }
  busy=false; $('bp').disabled=$('bm').disabled=false; render();
}

let pending=null;
function confirmDel(text, fn, msg){ pending={fn,msg}; $('dlgTxt').textContent=text; $('dlg').classList.add('on'); }
function askDelete(r){ confirmDel('Delete this transaction? ('+(r.type==='-'?'−':'+')+fmt(r.amount)+(r.note?' · '+r.note:'')+')', s=>{ s.tx=s.tx.filter(t=>t.id!==r.id); }, 'Delete '+(r.type)+r.amount+' ('+(myName||'')+')'); }
$('dlgNo').onclick=()=>{ pending=null; $('dlg').classList.remove('on'); };
$('dlgYes').onclick=async()=>{
  const p=pending; pending=null; $('dlg').classList.remove('on'); if(!p||busy) return;
  busy=true;
  try{ const ok=await mutate(p.fn, p.msg); toast(ok?'Deleted':'Delete failed'); }
  catch(e){ toast('Delete failed'); }
  busy=false; render();
};

// ====== Deposits ======
let dFilter='all';
const normOrd = s => String(s||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[^\dA-Za-z-]/g,'');
function renderDep(){
  const deps=state.deposits||[];
  $('dErr').textContent=state.shopSyncError?'⚠ Shopify: '+state.shopSyncError:''; $('dErr').classList.toggle('hide',!state.shopSyncError);
  let tot=0,open=0; deps.forEach(d=>{ const a=Number(d.amount)||0; tot+=a; if(!d.done) open+=a; });
  $('dTot').textContent=fmt(tot); $('dOpen').textContent=fmt(open); $('dCnt').textContent=deps.length;
  const q=normOrd($('dq').value);
  let shown=deps.filter(d=> (!q || String(d.order).includes(q)) && (dFilter==='all' || (dFilter==='done')===!!d.done));
  shown.sort((a,b)=> (a.done-b.done) || (Number(a.order)-Number(b.order)));
  $('dShown').textContent = q||dFilter!=='all' ? shown.length+' of '+deps.length : '';
  const list=$('dList'); list.innerHTML='';
  if(!shown.length){
    list.innerHTML = q ? '<div class="msg">No deposit for order #'+q+'<br>If they paid, enter the amount above and tap + Add</div>'+(orders&&orders.orders&&orders.orders[q]?detailsHTML(q):'') : '<div class="msg">No orders here</div>';
    if(q && (!$('dOrd').value || $('dOrd').value===renderDep.auto)){ $('dOrd').value=q; renderDep.auto=q; }
    return;
  }
  shown.forEach(d=>{
    const el=document.createElement('div'); el.className='drow'+(d.done?' done':'')+(q&&String(d.order)===q?' hit':'');
    const c=document.createElement('button'); c.className='chk'; c.textContent='✓'; c.onclick=()=>toggleDep(d);
    const i=document.createElement('div'); i.className='i';
    const o=document.createElement('div'); o.className='o'; o.textContent='#'+d.order;
    const w=document.createElement('div'); w.className='w';
    const od = orders && orders.orders && orders.orders[String(d.order)];
    const colTxt = (od ? ' · Collect '+fmt(collectFor(od,d)) : '') + (d.done?'':d.shopAt?' · Shopify ✓':d.shopErr?' · ⚠ Not on Shopify':' · ⏳ Shopify');
    w.textContent = (d.done ? 'Shipped'+(d.doneBy&&d.doneBy!=='Notebook'?' · '+d.doneBy+' · '+when(d.doneAt):'') : 'Not shipped yet') + colTxt;
    const sl=document.createElement('button'); sl.className='shop'; sl.style.border='0'; sl.textContent=openDet.has(d.id)?'▲ Hide details':'🛍 Order details';
    sl.onclick=()=>{ openDet.has(d.id)?openDet.delete(d.id):openDet.add(d.id); loadOrders(); renderDep(); };
    i.append(o,w,sl);
    const a=document.createElement('div'); a.className='a'; a.textContent=fmt(d.amount);
    const x=document.createElement('button'); x.className='x'; x.textContent='✕';
    x.onclick=()=>confirmDel('Delete deposit for order #'+d.order+' ('+fmt(d.amount)+')?'+((state.tx||[]).some(t=>t.depId===d.id)?' It will also be removed from Cash.':'')+(d.shopAt?' ⚠ The payment on Shopify stays — remove/refund it there.':''), s=>{ s.deposits=s.deposits.filter(t=>t.id!==d.id); s.tx=s.tx.filter(t=>t.depId!==d.id); }, 'Delete deposit #'+d.order+' ('+(myName||'')+')');
    el.append(c,i,a,x); list.appendChild(el);
    if(openDet.has(d.id) || (q && String(d.order)===q && shown.length===1)){ const dv=document.createElement('div'); dv.innerHTML=detailsHTML(d.order); list.appendChild(dv.firstElementChild); }
  });
}
async function toggleDep(d){
  if(busy) return;
  const nv=!d.done;
  d.done=nv; renderDep();  // show instantly
  busy=true;
  try{
    const ok=await mutate(s=>{ const t=s.deposits.find(x=>x.id===d.id); if(t){ t.done=nv; t.doneBy=nv?(myName||''):''; t.doneAt=nv?Date.now():0; } }, (nv?'✓ shipped #':'↺ unshipped #')+d.order+' ('+(myName||'')+')');
    toast(ok ? (nv?'#'+d.order+' Shipped ✓':'#'+d.order+' back to not shipped') : 'Save failed — try again');
  }catch(e){ toast('Save failed — check your internet'); }
  busy=false; render();
}
async function addDep(){
  if(busy) return;
  const order=normOrd($('dOrd').value), amount=parseAmt($('dAmt').value);
  if(!order){ toast('Enter the order number'); $('dOrd').focus(); return; }
  if(!amount){ toast('Enter the deposit'); $('dAmt').focus(); return; }
  if((state.deposits||[]).some(d=>String(d.order)===order)){ toast('Order #'+order+' already exists'); $('dq').value=order; renderDep(); return; }
  busy=true; $('dAdd').disabled=true;
  const rec={id:'d-'+order+'-'+Date.now().toString(36),order,amount,done:false,doneBy:'',doneAt:0,by:myName||'',at:Date.now()};
  try{
    const ok=await mutate(s=>{ if(!s.deposits.some(d=>String(d.order)===order)){ s.deposits.push(rec); s.tx.push({id:'tx-'+rec.id,amount,type:'+',note:'Deposit #'+order,by:myName||'',at:rec.at,depId:rec.id}); } }, 'Deposit #'+order+' '+amount+' ('+(myName||'')+')');
    if(ok){ openDet.add(rec.id); $('dOrd').value=''; $('dAmt').value=''; $('dq').value=''; toast('Added #'+order+' ✓ · +'+fmt(amount)+' to Cash · Shopify in a few min'); } else toast('Save failed — try again');
  }catch(e){ toast('Save failed — check your internet'); }
  busy=false; $('dAdd').disabled=false; render();
}
$('dAdd').onclick=addDep;
$('dAmt').addEventListener('keydown',e=>{ if(e.key==='Enter') addDep(); });
$('dq').addEventListener('input',renderDep);
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{ dFilter=b.dataset.f; document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x===b)); renderDep(); });
function showTab(t){
  $('vCash').classList.toggle('hide',t!=='cash'); $('vDep').classList.toggle('hide',t!=='dep');
  $('tCash').classList.toggle('on',t==='cash'); $('tDep').classList.toggle('on',t==='dep');
  ls.set('khazna_tab',t); refresh(true);
}
$('tCash').onclick=()=>showTab('cash');
$('tDep').onclick=()=>showTab('dep');
if(ls.get('khazna_tab')==='dep'){ $('vCash').classList.add('hide'); $('vDep').classList.remove('hide'); $('tCash').classList.remove('on'); $('tDep').classList.add('on'); }

function showSetup(err){ $('nm').value=myName||''; $('tok').value=token||''; $('setupErr').textContent=err||''; $('setup').classList.add('on'); }
$('save').onclick=async()=>{
  const n=$('nm').value.trim(), t=$('tok').value.trim();
  if(!n||!t){ $('setupErr').textContent='Enter your name and the token'; return; }
  token=t; myName=n; ls.set('khazna_token',t); ls.set('khazna_name',n);
  $('setupErr').textContent='Checking…';
  try{ await load(); $('setup').classList.remove('on'); refresh(); }
  catch(e){ $('setupErr').textContent = e.message==='auth' ? 'Token is wrong or has no Contents access to repo '+DATA_REPO : 'No connection, try again'; }
};
$('gear').onclick=()=>showSetup();
$('ref').onclick=()=>refresh();
$('bp').onclick=()=>add('+');
$('bm').onclick=()=>add('-');
[50,100,200,500,1000].forEach(v=>{ const b=document.createElement('button'); b.textContent='+'+v; b.onclick=()=>{ $('amt').value=String((parseAmt($('amt').value)||0)+v); }; $('quick').appendChild(b); });

document.addEventListener('visibilitychange',()=>{ if(!document.hidden) refresh(true); });
setInterval(()=>{ if(!document.hidden) refresh(true); }, 20000);

// ====== Notifications ======
function b64url(s){ const p='='.repeat((4-s.length%4)%4); const b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/')); return Uint8Array.from(b,c=>c.charCodeAt(0)); }
const SUBS_API = `https://api.github.com/repos/${OWNER}/${DATA_REPO}/contents/subs.json`;
async function saveSub(sub){
  const rec={name:myName||'',endpoint:sub.endpoint,keys:sub.keys,at:Date.now()};
  for(let i=0;i<4;i++){
    let cur={subs:[]}, csha=null;
    const g=await fetch(SUBS_API+'?t='+Date.now(),{cache:'no-store',headers:{'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json'}});
    if(g.ok){ const j=await g.json(); csha=j.sha; try{ cur=JSON.parse(b64dec(j.content)); }catch(e){} }
    else if(g.status!==404) throw new Error('auth');
    cur.subs=(cur.subs||[]).filter(s=>s.endpoint!==rec.endpoint); cur.subs.push(rec);
    const body={message:'Notifications on ('+(myName||'')+')',content:b64enc(JSON.stringify(cur,null,1))}; if(csha) body.sha=csha;
    const p=await fetch(SUBS_API,{method:'PUT',headers:{'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json'},body:JSON.stringify(body)});
    if(p.ok) return true;
    if(p.status!==409&&p.status!==422) throw new Error('http '+p.status);
  }
  return false;
}
async function swReg(){ if(!('serviceWorker' in navigator)) return null; try{ return await navigator.serviceWorker.register('sw.js'); }catch(e){ return null; } }
async function bellState(){
  let on=false;
  try{ const reg=await navigator.serviceWorker.getRegistration(); const s=reg&&await reg.pushManager.getSubscription(); on=!!s && Notification.permission==='granted'; }catch(e){}
  $('bell').textContent=on?'🔔':'🔕';
  $('notif').textContent=on?'🔔 Notifications are on':'🔔 Turn on notifications';
  return on;
}
async function enablePush(){
  const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent), standalone=window.navigator.standalone||matchMedia('(display-mode: standalone)').matches;
  if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window)){
    toast(isIOS&&!standalone?'Add Khazna to your Home Screen first, then open it from there':'This browser does not support notifications'); return;
  }
  if(!token||!myName){ toast('Save your name and token first'); return; }
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){ toast('Notifications are blocked — allow them in settings'); return; }
    const reg=await swReg(); await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64url(VAPID_PUBLIC)});
    const ok=await saveSub(sub.toJSON());
    toast(ok?'🔔 Notifications on':'Could not save — try again');
  }catch(e){ toast('Could not turn on notifications'); }
  bellState();
}
$('bell').onclick=enablePush;
$('notif').onclick=enablePush;
swReg().then(bellState);

if(!token||!myName) showSetup(); else refresh();
</script>
